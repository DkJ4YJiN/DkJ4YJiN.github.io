<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
/* ===================== TUNABLE CONSTANTS ===================== */
const BASE_SPEED = 9.2;          // tiles / second (multiplied per level)
const REGEN_TIME = 10;           // s until an eaten dot / pellet regrows
const LEVEL_EVERY = 120;         // s of play per level
const LANE_EVERY = 60;           // s between lane shifts
const WIDE_MIN = 0.35, WIDE_MAX = 0.65; // share of lanes that are wide
const SPECIAL_LIFE = 10;         // s a special dot stays
const SPECIAL_FAST = 3;          // s before expiry that it blinks faster
const POISON_FIRST = 20, POISON_EVERY = 60, WIDE_TIME = 30, WIDE_FLASH = 5;
const LIGHT_FIRST = 20, LIGHT_MIN = 20, LIGHT_MAX = 35, MAX_CHARGES = 9;
const HEART_FIRST = 20, HEART_EVERY = 120, MAX_LIVES = 9;
const SNAIL_FIRST = 20, SNAIL_EVERY = 60, SNAIL_TIME = 10;
const SNOW_FIRST = 20, SNOW_EVERY = 60, ICE_TIME = 5, ICE_FLASH = 2;
const START_LIVES = 3, EXTRA_LIFE_AT = 10000;
const READY_FIRST = 3.2, READY_NEXT = 2.0;   // s of READY!
const DEATH_FREEZE = 0.9, DEATH_ANIM = 1.5;  // s
const EAT_FREEZE = 0.8;          // s freeze when a ghost is eaten
const WIDE_R = 0.78, NORMAL_R = 0.42, GHOST_R = 0.5; // radii in tiles
const CLEAR_BONUS = 1000;
const FRUIT_EVERY = 100, FRUIT_TIME = 10;    // dots eaten / seconds on screen
const EYES_MULT = 1.5;           // eyes speed (x BASE_SPEED)
const ELROY1 = 20, ELROY2 = 10;  // "dots left" (current sweep) thresholds
const FRIGHT_SECS = [6,5,4,3,2,5,2,2,1,5,2,1,1,3,1,1,0,1];
const HS_KEY = 'pacman_highscore';

/* ===================== GEOMETRY / MAZE ===================== */
const TILE = 16, COLS = 28, ROWS = 31;
const W = COLS * TILE, H = (3 + ROWS + 2) * TILE;   // 448 x 576
const MAZE_Y = 3 * TILE;
const MAZE = [
'############## #############',
'#..........................#',
'#.####.#####.# ######.####.#',
'#o####.#####.# ######.####o#',
'#.####.#####.# ######.####.#',
'#..........................#',
'#.####.##.########.##.####.#',
'#.####.##.########.##.####.#',
'#......##....##....##......#',
'######.##### ## #####.######',
'     #.##### ## #####.#     ',
'     #.##          ##.#     ',
'     #.## ###--### ##.#     ',
'######.## #      # ##.######',
'      .   #      #   .      ',
'######.## #      # ##.######',
'     #.## ######## ##.#     ',
'     #.##          ##.#     ',
'     #.## ######## ##.#     ',
'######.## ######## ##.######',
'#............##............#',
'#.####.#####.##.#####.####.#',
'#.####.#####.##.#####.####.#',
'#o..##.......  .......##..o#',
'###.##.##.########.##.##.###',
'###.##.##.########.##.##.###',
'#......##....##....##......#',
'#.##########.##.##########.#',
'#.##########.##.##########.#',
'#..........................#',
'############## #############'];
const wc = c => ((c % COLS) + COLS) % COLS;
const wr = r => ((r % ROWS) + ROWS) % ROWS;
const idx = (c, r) => wr(r) * COLS + wc(c);
const isHouse = (c, r) => c >= 11 && c <= 16 && r >= 13 && r <= 15;
function open(c, r) {
  c = wc(c); r = wr(r);
  const k = MAZE[r][c];
  return k !== '#' && k !== '-' && !isHouse(c, r);
}
const DIRS = [[0,-1],[-1,0],[0,1],[1,0]];   // up, left, down, right (tie-break order)
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===================== LEVEL TABLES ===================== */
function lvParams(L) {
  if (L <= 1) return { pac: .80, gh: .75, tun: .40, pacF: .90, ghF: .50 };
  if (L <= 4) return { pac: .90, gh: .85, tun: .45, pacF: .95, ghF: .55 };
  if (L <= 20) return { pac: 1.0, gh: .95, tun: .50, pacF: 1.0, ghF: .60 };
  return { pac: .90, gh: .95, tun: .50, pacF: .90, ghF: .60 };
}
function frightSecs(L) { return L - 1 < FRIGHT_SECS.length ? FRIGHT_SECS[L - 1] : 0; }
function schedule(L) {
  if (L <= 1) return [7, 20, 7, 20, 5, 20, 5];
  if (L <= 4) return [7, 20, 7, 20, 5, 1033, 1 / 60];
  return [5, 20, 5, 20, 5, 1037, 1 / 60];
}
function releaseLimits(L) {
  if (L <= 1) return { pinky: 0, inky: 30, clyde: 60 };
  if (L === 2) return { pinky: 0, inky: 0, clyde: 50 };
  return { pinky: 0, inky: 0, clyde: 0 };
}
const DEATH_LIMITS = { pinky: 7, inky: 10, clyde: 15 };
const FRUIT_PTS = [100, 300, 500, 700, 1000, 2000, 3000, 5000];
function fruitKind(L) {
  if (L <= 1) return 0; if (L === 2) return 1; if (L <= 4) return 2; if (L <= 6) return 3;
  if (L <= 8) return 4; if (L <= 10) return 5; if (L <= 12) return 6; return 7;
}

/* ===================== BOARD STATE ===================== */
const N = COLS * ROWS;
const dots = new Uint8Array(N);      // 0 none, 1 dot, 2 pellet
const popT = new Float32Array(N);    // playT when regrown (pop-in)
const special = new Array(N).fill(null);
const sweepEaten = new Uint8Array(N);
let TOTAL = 0;
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const k = MAZE[r][c]; if (k === '.' || k === 'o') TOTAL++; }
let regrowQ = [], specList = [], sweepLeft = TOTAL;
function resetBoard() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = MAZE[r][c], i = r * COLS + c;
    dots[i] = k === '.' ? 1 : k === 'o' ? 2 : 0;
    popT[i] = -99; special[i] = null; sweepEaten[i] = 0;
  }
  regrowQ = []; specList = []; sweepLeft = TOTAL;
}
/* ===================== AUDIO (all synthesised) ===================== */
let AC = null, master, sfxBus, musBus, musDuck, sirenBus, leadIn, noiseBuf;
let muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
  sirenBus = AC.createGain(); sirenBus.gain.value = 1; sirenBus.connect(master);
  musBus = AC.createGain(); musBus.gain.value = 0.5;
  musDuck = AC.createGain(); musDuck.gain.value = 1;
  musBus.connect(musDuck); musDuck.connect(master);
  // lead bus with echo
  leadIn = AC.createGain(); leadIn.gain.value = 1; leadIn.connect(musBus);
  const dl = AC.createDelay(1); dl.delayTime.value = 3 * (60 / 126 / 4);
  const fb = AC.createGain(); fb.gain.value = 0.38;
  const wet = AC.createGain(); wet.gain.value = 0.35;
  leadIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(musBus);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function setMute(m) { muted = m; if (AC) master.gain.setTargetAtTime(m ? 0 : 0.85, AC.currentTime, 0.02); }
function now() { return AC ? AC.currentTime : 0; }

function tone(f0, f1, dur, type, vol, when, bus) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus || sfxBus);
  o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, when, hp, bus, lp) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1000;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f);
  if (lp) { const l = AC.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = lp; f.connect(l); l.connect(g); } else f.connect(g);
  g.connect(bus || sfxBus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
let wakaFlip = false;
const SFX = {
  waka() { wakaFlip = !wakaFlip; if (wakaFlip) tone(220, 520, 0.085, 'triangle', 0.22); else tone(520, 220, 0.085, 'triangle', 0.22); },
  pellet() { tone(160, 700, 0.18, 'triangle', 0.25); },
  ghost() { tone(200, 1500, 0.32, 'square', 0.14); tone(400, 1800, 0.28, 'triangle', 0.12, 0.04); },
  fruit() { [660, 880, 1320].forEach((f, i) => tone(f, f, 0.1, 'square', 0.12, i * 0.07)); },
  death() {
    [[1000,300],[850,240],[700,190],[560,150],[430,110]].forEach((p, i) => tone(p[0], p[1], 0.2, 'sawtooth', 0.14, i * 0.2));
    [1.05, 1.18, 1.31, 1.44].forEach(t => { noise(0.05, 0.4, t, 800); tone(900, 200, 0.06, 'square', 0.1, t); });
  },
  extra() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.12, 'square', 0.13, i * 0.07)); },
  gameover() { [440, 349, 294, 220].forEach((f, i) => tone(f, f * 0.98, 0.45, 'triangle', 0.22, i * 0.4)); },
  bolt() { tone(300, 1800, 0.18, 'sawtooth', 0.12); noise(0.12, 0.2, 0, 3000); tone(1800, 600, 0.12, 'square', 0.08, 0.1); },
  poison() { tone(220, 90, 0.5, 'sawtooth', 0.12); tone(180, 70, 0.5, 'square', 0.07, 0.05); tone(500, 300, 0.2, 'triangle', 0.1, 0.1); },
  lane() { tone(300, 900, 0.25, 'triangle', 0.18); tone(900, 300, 0.25, 'triangle', 0.18, 0.25); noise(0.4, 0.08, 0, 1500, null, 6000); },
  teleport() { tone(200, 1600, 0.2, 'sine', 0.22); tone(1600, 300, 0.25, 'sine', 0.2, 0.18); noise(0.3, 0.1, 0, 2000); },
  snail() { tone(110, 90, 0.2, 'triangle', 0.25); tone(110, 90, 0.2, 'triangle', 0.25, 0.28); tone(165, 130, 0.25, 'triangle', 0.2, 0.55); },
  snow() { [2093, 2637, 3136, 2637, 3520].forEach((f, i) => tone(f, f, 0.18, 'sine', 0.1, i * 0.06)); tone(900, 1800, 0.3, 'sine', 0.08); },
  level() { [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.1, 'square', 0.1, i * 0.06)); },
  clear() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.1, 'square', 0.11, i * 0.07)); },
  intro() {
    // original ~3.2 s arcade fanfare: 4 bars of 0.8 s, 8 arpeggio notes per bar
    const bars = [[220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7], [220, 261.6, 329.6]];
    const bass = [55, 43.65, 49, 55];
    bars.forEach((ch, b) => {
      const t0 = b * 0.8;
      tone(bass[b], bass[b], 0.72, 'sawtooth', 0.09, t0);
      const pat = [0, 1, 2, 3, 2, 1, 2, 3];
      pat.forEach((p, i) => {
        const f = ch[p % 3] * (p >= 3 ? 4 : 2) * (b === 3 && i > 4 ? 2 : 1);
        tone(f, f, 0.09, 'square', 0.09, t0 + i * 0.1);
      });
    });
    tone(880, 880, 0.6, 'square', 0.08, 2.6);
  }
};
function sfx(n) { if (AC && SFX[n]) SFX[n](); }

/* ---------- soft sirens ---------- */
let sirenNode = null, sirenKind = null;
function duck(on) { if (AC) musDuck.gain.setTargetAtTime(on ? 0.3 : 1, AC.currentTime, 0.06); }
function stopSiren() {
  if (!AC) { sirenKind = null; return; }
  if (sirenNode) {
    const t = AC.currentTime;
    sirenNode.g.gain.cancelScheduledValues(t); sirenNode.g.gain.setTargetAtTime(0, t, 0.03);
    sirenNode.o.stop(t + 0.25); sirenNode.lfo.stop(t + 0.25); sirenNode = null;
  }
  sirenKind = null; duck(false);
}
function setSiren(kind) {
  if (!AC || kind === sirenKind) return;
  stopSiren();
  if (!kind) return;
  sirenKind = kind;
  const p = kind === 'eyes' ? { base: 620, depth: 40, rate: 4.0, cut: 1500 } : { base: 330, depth: 45, rate: 3.5, cut: 1100 };
  const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = p.base;
  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = p.rate;
  const lg = AC.createGain(); lg.gain.value = p.depth; lfo.connect(lg); lg.connect(o.frequency);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p.cut;
  const g = AC.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.035, AC.currentTime, 0.05);
  o.connect(f); f.connect(g); g.connect(sirenBus);
  o.start(); lfo.start();
  sirenNode = { o, lfo, g }; duck(true);
}

/* ---------- 80s synthwave loop: 126 BPM, A minor, Am F C G ---------- */
const BPM = 126, S16 = 60 / BPM / 4;
const CHORDS = [
  { root: 55.00, tri: [440.00, 523.25, 659.25] },   // Am
  { root: 43.65, tri: [349.23, 440.00, 523.25] },   // F
  { root: 65.41, tri: [523.25, 659.25, 783.99] },   // C
  { root: 49.00, tri: [392.00, 493.88, 587.33] }    // G
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// original lead melody: [step in 64, midi, length in 16ths]
const LEAD = [
  [0,69,2],[2,72,2],[4,76,4],[8,74,2],[10,72,2],[12,76,4],
  [16,72,2],[18,69,2],[20,77,4],[24,76,2],[26,77,2],[28,81,4],
  [32,79,4],[36,76,4],[40,72,2],[42,74,2],[44,76,4],
  [48,74,2],[50,71,2],[52,67,4],[56,69,2],[58,71,2],[60,74,2],[62,76,2]
];
const LEADMAP = {}; LEAD.forEach(n => LEADMAP[n[0]] = n);
let musOn = false, musStep = 0, musNext = 0, musTimer = null;
function mKick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  o.connect(g); g.connect(musBus); o.start(t); o.stop(t + 0.26);
}
function mNoise(t, dur, vol, hp) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(musBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function mSnare(t) {
  mNoise(t, 0.14, 0.4, 1500);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.1);
  g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(musBus); o.start(t); o.stop(t + 0.14);
}
function mBass(t, f, dur) {
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
  lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(180, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.38, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(lp); lp.connect(g); g.connect(musBus); o.start(t); o.stop(t + dur + 0.02);
}
function mArp(t, f) {
  const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.07, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + S16 * 0.9);
  o.connect(g); g.connect(musBus); o.start(t); o.stop(t + S16);
}
function mLead(t, f, dur) {
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.015); g.gain.setValueAtTime(0.14, t + dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  lp.connect(g); g.connect(leadIn);
  [['sawtooth', -7], ['sawtooth', 7], ['square', 0]].forEach(s => {
    const o = AC.createOscillator(); o.type = s[0]; o.frequency.value = f; o.detune.value = s[1];
    const og = AC.createGain(); og.gain.value = s[0] === 'square' ? 0.5 : 0.7;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05);
  });

function schedStep(s, t) {
  const bar = (s >> 4) & 3, p = s & 15, ch = CHORDS[bar];
  if (p % 4 === 0) mKick(t);
  if (p === 4 || p === 12) mSnare(t);
  if (p % 2 === 0) mNoise(t, 0.04, p % 4 === 2 ? 0.2 : 0.1, 7500);
  if (p % 2 === 0) mBass(t, ((p >> 1) % 2 === 0) ? ch.root : ch.root * 2, S16 * 1.8);
  const ap = [0, 1, 2, 1][p & 3];

function musicTick() {
  if (!AC || !musOn) return;
  while (musNext < AC.currentTime + 0.15) { schedStep(musStep, musNext); musNext += S16; musStep = (musStep + 1) & 63; }
}
function musicStart() {
  if (!AC || musOn) return;
  musOn = true; musStep = 0; musNext = AC.currentTime + 0.06;
  musBus.gain.cancelScheduledValues(AC.currentTime); musBus.gain.setValueAtTime(0.5, AC.currentTime);
  musTimer = setInterval(musicTick, 25);
}
function musicStop() {
  musOn = false; clearInterval(musTimer);
  if (AC) { musBus.gain.cancelScheduledValues(AC.currentTime); musBus.gain.setTargetAtTime(0, AC.currentTime, 0.02); }
}
/* ===================== LANES ===================== */
const isJ = new Uint8Array(N);
const laneOf = new Int16Array(N).fill(-1);
const junLanes = new Array(N).fill(null);
const wideTile = new Uint8Array(N);
const lanes = [];
// tiles reachable from Pac-Man's start (the blank areas beside the ghost house are not part of the board)
const reach = new Uint8Array(N);
(() => {
  const q = [[13, 23]]; reach[idx(13, 23)] = 1;
  for (let h = 0; h < q.length; h++) for (const d of DIRS) {
    const c = wc(q[h][0] + d[0]), r = wr(q[h][1] + d[1]);
    if (open(c, r) && !reach[idx(c, r)]) { reach[idx(c, r)] = 1; q.push([c, r]); }
  }
})();
const openL = (c, r) => open(c, r) && reach[idx(c, r)] === 1;
function nbrs(c, r) {
  const o = [];
  for (const d of DIRS) if (openL(c + d[0], r + d[1])) o.push([wc(c + d[0]), wr(r + d[1])]);
  return o;
}
function buildLaneGraph() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (openL(c, r) && nbrs(c, r).length >= 3) { isJ[idx(c, r)] = 1; junLanes[idx(c, r)] = []; }
  const seen = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!isJ[idx(c, r)]) continue;
    for (const nb of nbrs(c, r)) {
      let prev = [c, r], cur = nb; const path = []; let g = 0;
      while (!isJ[idx(cur[0], cur[1])] && g++ < 300) {
        path.push(cur);
        const ns = nbrs(cur[0], cur[1]).filter(n => !(n[0] === prev[0] && n[1] === prev[1]));
        if (!ns.length) break;
        prev = cur; cur = ns[0];
      }
      let key;
      if (path.length) {
        const a = idx(path[0][0], path[0][1]), b = idx(path[path.length - 1][0], path[path.length - 1][1]);
        key = Math.min(a, b) + '-' + Math.max(a, b) + '-' + path.length;
      } else {
        const a = idx(c, r), b = idx(cur[0], cur[1]);
        key = Math.min(a, b) + '~' + Math.max(a, b);

/* ===================== EATING / COLLISION ===================== */
function handleEating() {

  else if (dots[i] === 1) { onDotEaten(i, 10, 'dot'); sfx('waka'); }
  else if (dots[i] === 2) { onDotEaten(i, 50, 'pellet'); sfx('pellet'); powerPellet(); }
  if (fruit && Math.hypot(pac.x - 13.5, pac.y - 17) < 0.8) {
    addScore(fruit.pts); pops.push({ x: 13.5, y: 17, text: String(fruit.pts), t: 0, dur: 1.2, col: '#ff80ff' }); sfx('fruit'); fruit = null;

}
function eatGhost(g) {

}

/* ===================== MAIN UPDATE (one sub-step) ===================== */

}
function update(h) {

  if (laneT >= LANE_EVERY) { laneT -= LANE_EVERY; shiftLanes(); msg('LANES SHIFTED!', '#ff5050', 2.4); sfx('lane'); }
  if (pac.wide > 0) pac.wide = Math.max(0, pac.wide - h);
  if (snailT > 0) snailT = Math.max(0, snailT - h);
  ghosts.forEach(g => { if (g.frozen > 0) g.frozen = Math.max(0, g.frozen - h); });
  if (fruit) { fruit.t -= h; if (fruit.t <= 0) fruit = null; }
  updateSpecials(); updateRegrow(); updateModes(h); updateRelease(h);
  const P = lvParams(level);
  const v = BASE_SPEED * (frightT > 0 ? P.pacF : P.pac);
  pac.moving = stepEntity(pac, v * h, pacDecide);
  if (pac.moving) pac.mouthPh += v * h;
  handleEating();
  if (state !== 'play') return;
  ghosts.forEach(g => updateGhost(g, h));
  handleCollisions();
  if (state !== 'play') return;
  setSiren(ghosts.some(g => g.state === 'eyes' || g.state === 'entering') ? 'eyes' : frightT > 0 ? 'power' : null);
}

  for (let i = 0; i < n; i++) drawPacSprite(ctx, 18 + i * 20, 553, 7, Math.PI, 0.5, '#ffe800');
  const fh = fruitHist.slice(-5);
  fh.forEach((k, i) => drawFruit(ctx, k, W - 16 - (fh.length - 1 - i) * 22, 553, 1.0));
  const y = 572;
  const lr = Math.max(0, Math.ceil(LANE_EVERY - laneT));
  const red = (LANE_EVERY - laneT) <= 5 && Math.floor(animT * 4) % 2 === 0;
  txt('LANES ' + lr + 's', 8, y, 11, (LANE_EVERY - laneT) <= 5 ? (red ? '#ff3030' : '#ffffff') : '#aab', 'left');
  if (pac.wide > 0) txt('FAT ' + Math.ceil(pac.wide) + 's', 112, y, 11, (pac.wide <= WIDE_FLASH && Math.floor(animT * 6) % 2) ? '#fff' : '#9cff2a');
  if (snailT > 0) txt('SLOW ' + Math.ceil(snailT) + 's', 196, y, 11, '#ffb060');
  const fz = Math.max(0, ...ghosts.map(g => g.state === 'eyes' ? 0 : g.frozen));
  if (fz > 0) txt('ICE ' + Math.ceil(fz) + 's', 290, y, 11, (fz <= ICE_FLASH && Math.floor(animT * 6) % 2) ? '#fff' : '#9fe8ff');
  if (muted) txt('MUTE', W - 8, y, 11, '#f66', 'right');
}

/* ---------- screens ---------- */
function drawTitle() {
  txt('PAC-SHIFT', 224, 42, 34, '#ffee00', 'center', '#ff9900');
  txt('REGROWTH  *  LANES  *  CHAOS', 224, 60, 10, '#8899aa', 'center');
  // chase animation
  const t = titleT % 12, ay = 88;
  const cols = ['#ff0000', '#ffb8ff', '#00ffff', '#ffb852'];
  if (t < 6) {
    const x = -20 + t * (488 / 6);
    drawPacSprite(ctx, x, ay, 9, 0, 0.06 + 0.5 * Math.abs(Math.sin(titleT * 12)), '#ffe800');
    cols.forEach((c, i) => drawGhostSprite(ctx, x - 34 - i * 22, ay, c, 1, 0, { t: titleT }));
  } else {
    const x = 468 - (t - 6) * (488 / 6);
    drawPacSprite(ctx, x, ay, 12, Math.PI, 0.06 + 0.5 * Math.abs(Math.sin(titleT * 12)), '#b6ff2e', '#8cff00');
    cols.forEach((c, i) => drawGhostSprite(ctx, x - 34 - i * 22, ay, c, -1, 0, { t: titleT, fright: true }));
  }
  txt('THE GHOSTS', 224, 122, 11, '#fff', 'center');
  [['BLINKY', 'SHADOW  - chases you', 0], ['PINKY', 'SPEEDY  - ambushes ahead', 1], ['INKY', 'BASHFUL - flanks via Blinky', 2], ['CLYDE', 'POKEY   - shy up close', 3]].forEach((g, i) => {
    const y = 142 + i * 17;
    drawGhostSprite(ctx, 62, y - 3, cols[g[2]], 1, 0, { t: 0 });
    txt(g[0], 80, y, 11, cols[g[2]]); txt(g[1], 150, y, 10, '#bcd');
  });
  txt('POINTS', 224, 224, 11, '#fff', 'center');
  txt('DOT 10   PELLET 50   GHOSTS 200-400-800-1600', 224, 239, 10, '#bcd', 'center');
  txt('FRUIT 100-5000   EXTRA LIFE AT 10000', 224, 252, 10, '#bcd', 'center');
  txt('SPECIAL DOTS  (replace a dot for 10 s)', 224, 275, 11, '#fff', 'center');
  const spec = [
    ['poison', 'POISON   fat Pac-Man 30s: wide lanes only'],
    ['light', 'BOLT     +1 teleport charge (SPACE)'],
    ['heart', 'HEART    +1 life'],
    ['snail', 'SNAIL    ghosts at half speed 10s'],
    ['snow', 'SNOW     freeze all ghosts 5s']];
  spec.forEach((s, i) => {
    const y = 295 + i * 21; drawSpecial(ctx, 44, y - 4, { type: s[0], born: playT - 1 + (animT % 1) * 0 });
    txt(s[1], 66, y, 10, '#cde');
  });
  txt('LANES  shift every 60 s', 224, 414, 11, '#fff', 'center');
  txt('wide lane = two dashed lines  |  narrow = one line + bumpers', 224, 429, 9, '#bcd', 'center');
  txt('Dots & pellets regrow after 10 s. Level rises every 2 min.', 224, 442, 9, '#bcd', 'center');
  txt('CONTROLS', 224, 466, 11, '#fff', 'center');
  txt('ARROWS / WASD  move      SPACE  teleport', 224, 482, 10, '#bcd', 'center');
  txt('P  pause      M  mute      SWIPE move, TAP teleport', 224, 496, 10, '#bcd', 'center');
  if (Math.floor(animT * 2) % 2 === 0) txt('PRESS ANY KEY OR TAP TO START', 224, 534, 14, '#ffee00', 'center');
  txt('HIGH SCORE  ' + hi, 224, 558, 11, '#fff', 'center');
}
function dim(a) { ctx.fillStyle = 'rgba(0,0,0,' + a + ')'; ctx.fillRect(0, MAZE_Y, W, ROWS * TILE); }
function drawOverlays() {
  if (state === 'ready') txt('READY!', 13.5 * TILE + 8, MAZE_Y + 17 * TILE + 13, 14, '#ffee00', 'center');
  if (state === 'gameover') {
    dim(0.78);
    txt('GAME OVER', 224, 250, 34, '#ff3030', 'center', '#f00');
    txt('SCORE  ' + score, 224, 292, 16, '#fff', 'center');
    txt('HIGH SCORE  ' + hi, 224, 316, 16, '#fff', 'center');
    if (score > 0 && score >= hi) txt('NEW HIGH SCORE!', 224, 342, 14, '#ffee00', 'center');
    txt('LEVEL ' + level, 224, 366, 12, '#9fe8ff', 'center');
    if (stateT > 0.6 && Math.floor(animT * 2) % 2 === 0) txt('PRESS ENTER / SPACE / TAP', 224, 410, 13, '#ffee00', 'center');
  }
  if (paused && state !== 'title') { dim(0.7); txt('PAUSED', 224, 290, 30, '#ffee00', 'center', '#fa0'); txt('P to resume', 224, 316, 12, '#bcd', 'center'); }
}
function render() {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  drawHUD();
  ctx.drawImage(wallCv, 0, MAZE_Y, W, ROWS * TILE);
  ctx.drawImage(laneCv, 0, MAZE_Y, W, ROWS * TILE);
  drawDots();
  drawWorld();
  drawBottom();
  drawOverlays();
}
/* ===================== INPUT ===================== */
const KEYDIR = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
};
const held = [];
function setWant(dx, dy, sticky) {
  want = { dx, dy }; wantExpire = sticky ? 0 : animT + 0.6;
  if (state === 'play' && (pac.dx || pac.dy) && pac.dx === -dx && pac.dy === -dy) {
    pac.dx = dx; pac.dy = dy; pac.fx = dx; pac.fy = dy;       // instant reversal
  }
}
function togglePause() {
  if (state === 'title') return;
  paused = !paused;
  if (AC) { if (paused) AC.suspend(); else AC.resume(); }
}
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  initAudio();
  const k = e.key;
  if (k === 'm' || k === 'M') { setMute(!muted); e.preventDefault(); return; }
  if (state === 'title') { if (k.length === 1 || k.startsWith('Arrow') || k === 'Enter') { newGame(); e.preventDefault(); } return; }
  if (k === 'p' || k === 'P') { togglePause(); e.preventDefault(); return; }
  if (state === 'gameover') { if (stateT > 0.6 && (k === 'Enter' || k === ' ')) newGame(); e.preventDefault(); return; }
  if (KEYDIR[k]) {
    e.preventDefault();
    const d = KEYDIR[k];
    if (!held.includes(k)) held.push(k);
    if (!paused) setWant(d[0], d[1], true);
  } else if (k === ' ') { e.preventDefault(); if (!paused) teleport(); }
});
window.addEventListener('keyup', e => {
  const k = e.key, i = held.indexOf(k);
  if (i >= 0) held.splice(i, 1);
  if (KEYDIR[k]) {
    if (held.length) { const d = KEYDIR[held[held.length - 1]]; want = { dx: d[0], dy: d[1] }; }
    else wantExpire = animT + 0.5;
  }
});
let tsx = 0, tsy = 0, tmoved = false;
cv.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio();
  const t = e.changedTouches[0]; tsx = t.clientX; tsy = t.clientY; tmoved = false;
  if (state === 'title') newGame();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0], dx = t.clientX - tsx, dy = t.clientY - tsy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
    tmoved = true;
    if (Math.abs(dx) > Math.abs(dy)) setWant(dx > 0 ? 1 : -1, 0, false); else setWant(0, dy > 0 ? 1 : -1, false);
    tsx = t.clientX; tsy = t.clientY;
  }
}, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (tmoved) return;
  if (state === 'gameover') { if (stateT > 0.6) newGame(); } else if (paused) togglePause(); else teleport();
}, { passive: false });
cv.addEventListener('mousedown', () => {
  initAudio();
  if (state === 'title') newGame(); else if (state === 'gameover' && stateT > 0.6) newGame();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused && state !== 'title') togglePause(); });
window.addEventListener('pagehide', saveHi);

/* ===================== MAIN LOOP ===================== */
shiftLanes();
let lastTs = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  if (!paused) advance(dt); else animT += dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>

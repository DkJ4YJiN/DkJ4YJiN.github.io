<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PAC-MAN</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#6f77a8;font-family:"Courier New",monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,calc((100vh - 28px) * 448 / 576));height:auto;background:#000;touch-action:none;outline:none;cursor:pointer}
  #help{font-size:12px;height:28px;line-height:28px;letter-spacing:1px;white-space:nowrap;text-align:center}
</style>
</head>
<body>
<canvas id="game" width="448" height="576" tabindex="0"></canvas>
<div id="help">ARROWS / WASD MOVE &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; SPACE OR DOUBLE-TAP TELEPORT &nbsp;·&nbsp; M MUTE &nbsp;·&nbsp; ENTER START</div>
<script>
(() => {
'use strict';

/* =====================================================================
   CONSTANTS & MAZE
   ===================================================================== */
const T = 16, COLS = 28, ROWS = 31, HUD_TOP = 3, HUD_BOT = 2;
const W = COLS * T, H = (ROWS + HUD_TOP + HUD_BOT) * T, OFFY = HUD_TOP * T;
const SCALE = Math.min(3, Math.max(2, Math.ceil(window.devicePixelRatio || 1)));
const TUNNEL_ROW = 14;
const BASE_SPEED = 9.2;                 // tiles / second at "100%"

const MAZE = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"     #.##### ## #####.#     ",
"     #.##          ##.#     ",
"     #.## ###--### ##.#     ",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"     #.## ######## ##.#     ",
"     #.##          ##.#     ",
"     #.## ######## ##.#     ",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##.......  .......##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#..........................#",
"############################"
];

const setCell = (r, c, ch) => { MAZE[r] = MAZE[r].slice(0, c) + ch + MAZE[r].slice(c + 1); };
// vertical passage (col 14): 1-tile shaft through the top-centre pillar, opening in the bottom border
setCell(0, 14, ' '); setCell(30, 14, ' ');
setCell(1, 13, '.'); setCell(1, 14, '.');                       // top corridor now runs straight across
for (let r = 2; r <= 4; r++) { setCell(r, 14, ' '); setCell(r, 15, '#'); }   // wall off the lane beside the shaft
const PASS_COL = 14;

const canvas = document.getElementById('game');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');

/* ---- directions ---- */
const UP = {x:0,y:-1,i:0}, LEFT = {x:-1,y:0,i:1}, DOWN = {x:0,y:1,i:2}, RIGHT = {x:1,y:0,i:3}, NONE = {x:0,y:0,i:-1};
const DIRS = [UP, LEFT, DOWN, RIGHT];
const OPP = [DOWN, RIGHT, UP, LEFT];
const opp = d => d === NONE ? NONE : OPP[d.i];

function walkable(c, r) {
  if (r === TUNNEL_ROW && (c < 0 || c >= COLS)) return true;
  if (c === PASS_COL && (r < 0 || r >= ROWS)) return true;       // vertical passage wrap
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
  const ch = MAZE[r][c];
  return ch !== '#' && ch !== '-';
}
const canMove = (c, r, d) => walkable(c + d.x, r + d.y);

/* BFS distance map to the tile just above the ghost-house door (used by "eyes") */
const DIST = (() => {
  const d = MAZE.map(row => Array.from(row, () => 1e9));
  const q = [[13, 11], [14, 11]];
  q.forEach(([c, r]) => d[r][c] = 0);
  for (let h = 0; h < q.length; h++) {
    const [c, r] = q[h];
    for (const dir of DIRS) {
      const nc = c + dir.x, nr = r + dir.y;
      if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
      if (!walkable(nc, nr) || d[nr][nc] < 1e9) continue;
      d[nr][nc] = d[r][c] + 1; q.push([nc, nr]);
    }
  }
  return d;
})();
function distTo(c, r) {
  if (r < 0 || r >= ROWS) return 1e9;
  c = Math.max(0, Math.min(COLS - 1, c));
  return DIST[r][c];
}

/* =====================================================================
   LANES  (normal / wide, random)
   ===================================================================== */
const reach = MAZE.map(row => Array.from(row, () => false));
const laneOf = MAZE.map(row => Array.from(row, () => -1));
const tileWide = MAZE.map(row => Array.from(row, () => true));
const lanes = [];
(() => {
  const q = [[14, 23]]; reach[23][14] = true;
  for (let h = 0; h < q.length; h++) {
    const [c, r] = q[h];
    for (const d of DIRS) {
      const nc = c + d.x, nr = r + d.y;
      if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || reach[nr][nc] || !walkable(nc, nr)) continue;
      reach[nr][nc] = true; q.push([nc, nr]);
    }
  }
})();
const inReach = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && reach[r][c];
const isJunction = (c, r) => reach[r][c] && DIRS.filter(d => inReach(c + d.x, r + d.y)).length >= 3;
(() => {   // a lane = chain of tiles between junctions
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!reach[r][c] || isJunction(c, r) || laneOf[r][c] >= 0) continue;
    const id = lanes.length, q = [[c, r]]; laneOf[r][c] = id;
    for (let h = 0; h < q.length; h++) {
      const [qc, qr] = q[h];
      for (const d of DIRS) {
        const nc = qc + d.x, nr = qr + d.y;
        if (!inReach(nc, nr) || isJunction(nc, nr) || laneOf[nr][nc] >= 0) continue;
        laneOf[nr][nc] = id; q.push([nc, nr]);
      }
    }
    lanes.push(q);
  }
})();
let laneCanvas = null;
function randomizeLanes() {
  let flag = [];
  for (let tries = 0; tries < 40; tries++) {
    flag = lanes.map(() => Math.random() < 0.5);
    const n = flag.filter(Boolean).length;
    if (n >= lanes.length * 0.35 && n <= lanes.length * 0.65) break;
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!reach[r][c]) { tileWide[r][c] = true; continue; }
    if (laneOf[r][c] >= 0) { tileWide[r][c] = flag[laneOf[r][c]]; continue; }
    let has = false, any = false;                       // junction: wide if any neighbouring lane is wide
    for (const d of DIRS) { const nc = c + d.x, nr = r + d.y; if (inReach(nc, nr) && laneOf[nr][nc] >= 0) { has = true; if (flag[laneOf[nr][nc]]) any = true; } }
    tileWide[r][c] = !has || any;
  }
  buildLaneOverlay();
}
function laneOK(c, r) {
  if (r < 0 || r >= ROWS) return true;
  c = Math.max(0, Math.min(COLS - 1, c));
  return tileWide[r][c];
}
function buildLaneOverlay() {
  if (!laneCanvas) { laneCanvas = document.createElement('canvas'); laneCanvas.width = W * SCALE; laneCanvas.height = ROWS * T * SCALE; }
  const g = laneCanvas.getContext('2d');
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.clearRect(0, 0, W, ROWS * T);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!reach[r][c]) continue;
    const x = c * T, y = r * T;
    const wide = tileWide[r][c], mx = x + T / 2, my = y + T / 2;
    g.save(); g.strokeStyle = 'rgba(170,170,170,0.75)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    for (const d of DIRS) {                              // dashed guide line(s) toward each open neighbour
      if (!walkable(c + d.x, r + d.y)) continue;
      const offs = wide ? [-3.6, 3.6] : [0];
      for (const o of offs) {
        const ox = d.y !== 0 ? o : 0, oy = d.x !== 0 ? o : 0;
        const back = wide ? 3.6 : 0;
        g.beginPath(); g.moveTo(mx + ox - d.x * back, my + oy - d.y * back); g.lineTo(mx + ox + d.x * T / 2, my + oy + d.y * T / 2); g.stroke();
      }
    }
    g.restore();
    if (wide) continue;
    // narrow tile: add inner bumpers along every wall side
    g.fillStyle = '#4a5bff';
    const cx = x + T / 2, cy = y + T / 2, a = 12.8, b = 6.8;
    if (!walkable(c, r - 1)) g.fillRect(x, cy - a, T, a - b);
    if (!walkable(c, r + 1)) g.fillRect(x, cy + b, T, a - b);
    if (!walkable(c - 1, r)) g.fillRect(cx - a, y, a - b, T);
    if (!walkable(c + 1, r)) g.fillRect(cx + b, y, a - b, T);
  }
}

/* =====================================================================
   PRE-RENDERED WALLS
   ===================================================================== */
function buildWalls(color) {
  const c = document.createElement('canvas');
  c.width = W * SCALE; c.height = ROWS * T * SCALE;
  const g = c.getContext('2d');
  g.scale(SCALE, SCALE);
  const wall = (cc, rr) => rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && MAZE[rr][cc] === '#';
  const w1 = T * 0.4, w2 = w1 - 3;
  for (const pass of [0, 1]) {
    const lw = pass ? w2 : w1;
    g.strokeStyle = g.fillStyle = pass ? '#000' : color;
    g.lineWidth = lw; g.lineCap = 'round';
    if (!pass) { g.shadowColor = color; g.shadowBlur = 7; } else { g.shadowBlur = 0; }
    g.beginPath();
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
      if (!wall(cc, r)) continue;
      const x = (cc + 0.5) * T, y = (r + 0.5) * T;
      g.moveTo(x + lw / 2, y); g.arc(x, y, lw / 2, 0, Math.PI * 2);
      if (wall(cc + 1, r)) { g.moveTo(x, y); g.lineTo(x + T, y); }
      if (wall(cc, r + 1)) { g.moveTo(x, y); g.lineTo(x, y + T); }
      if (wall(cc + 1, r) && wall(cc, r + 1) && wall(cc + 1, r + 1)) g.rect(x, y, T, T);   // fill interior of thick blocks
    }
    g.fill(); g.stroke();
  }
  // ghost-house door
  g.shadowBlur = 0; g.strokeStyle = '#ffb8de'; g.lineWidth = 3; g.lineCap = 'butt';
  g.beginPath(); g.moveTo(13 * T, 12.5 * T); g.lineTo(15 * T, 12.5 * T); g.stroke();
  return c;
}
const wallsBlue = buildWalls('#2535ff');

/* =====================================================================
   AUDIO  (all synthesized with Web Audio – no files)
   ===================================================================== */
const Sound = (() => {
  let ac = null, master, sfxBus, musicBus, drumBus, bassF, leadF, delayIn, noiseBuf;
  let muted = false, musicOn = false, timer = null, step = 0, nextT = 0, wakaFlip = false;
  const loops = {};
  const BPM = 126, SD = 60 / BPM / 4;
  const ROOT = [45, 41, 48, 43];                         // Am  F  C  G
  const CH = [[57,60,64],[53,57,60],[55,60,64],[55,59,62]];
  const BASS = [0,0,12,0,0,12,0,12];
  const ARP = [0,1,2,3,2,1,2,3,0,1,2,3,2,1,2,1];
  const LEAD = [
    [76,0,0,76, 0,74,72,0, 74,0,0,0, 72,0,69,0],
    [72,0,0,72, 0,69,72,0, 77,0,0,0, 74,0,72,0],
    [76,0,0,76, 0,79,76,0, 74,0,72,0, 67,0,72,0],
    [74,0,0,74, 0,71,74,0, 79,0,0,0, 74,0,71,0]
  ];
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
    drumBus = ac.createGain(); drumBus.gain.value = 1; drumBus.connect(musicBus);
    bassF = ac.createBiquadFilter(); bassF.type = 'lowpass'; bassF.frequency.value = 650; bassF.connect(musicBus);
    leadF = ac.createBiquadFilter(); leadF.type = 'lowpass'; leadF.frequency.value = 3200; leadF.connect(musicBus);
    delayIn = ac.createGain(); delayIn.gain.value = 1; delayIn.connect(leadF);
    const dl = ac.createDelay(1); dl.delayTime.value = SD * 3;
    const fb = ac.createGain(); fb.gain.value = 0.32;
    const wet = ac.createGain(); wet.gain.value = 0.35;
    delayIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(leadF);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  /* ---- primitives ---- */
  function tone(o) {
    if (!ac) return;
    const t = ac.currentTime + (o.at || 0), dur = Math.max(0.04, o.dur || 0.1), vol = o.vol == null ? 0.15 : o.vol;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + Math.max(0.007, dur - 0.03));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, hp, dest) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function voice(type, f, t, dur, vol, dest, detune, pluck) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    if (pluck) g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    else { g.gain.setValueAtTime(vol, t + Math.max(0.011, dur - 0.05)); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }

  /* ---- music ---- */
  function playStep(s, t) {
    const bar = (s >> 4) & 3, i = s & 15;
    if (i % 4 === 0) {                                   // kick
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(drumBus); o.start(t); o.stop(t + 0.22);
    }
    if (i === 4 || i === 12) {                           // snare
      noise(t, 0.14, 0.2, 1400, drumBus);
      voice('triangle', 190, t, 0.09, 0.12, drumBus, 0, true);
    }
    if (i % 2 === 0) noise(t, i % 4 === 2 ? 0.09 : 0.03, i % 4 === 2 ? 0.06 : 0.05, 7000, drumBus);   // hats
    if (i % 2 === 0) {                                   // bass
      const n = ROOT[bar] + BASS[i >> 1];
      voice('sawtooth', mtof(n), t, SD * 1.9, 0.17, bassF, 0, false);
    }
    const c = CH[bar], arr = [c[0], c[1], c[2], c[0] + 12];   // arpeggio
    voice('square', mtof(arr[ARP[i]]), t, SD * 1.4, 0.035, delayIn, 0, true);
    const m = LEAD[bar][i];                              // lead
    if (m) {
      let len = 1; while (i + len < 16 && !LEAD[bar][i + len] && len < 4) len++;
      const d = SD * len * 0.95;
      voice('sawtooth', mtof(m), t, d, 0.05, delayIn, -8, false);
      voice('square', mtof(m), t, d, 0.04, delayIn, 8, false);
    }
  }
  function sched() {
    if (!ac || !musicOn) return;
    if (nextT < ac.currentTime - 0.1) nextT = ac.currentTime + 0.02;
    while (nextT < ac.currentTime + 0.15) { playStep(step, nextT); nextT += SD; step = (step + 1) & 63; }
  }
  function startMusic() {
    if (!ac || musicOn) return;
    musicOn = true; step = 0; nextT = ac.currentTime + 0.05;
    timer = setInterval(sched, 25);
  }
  function stopMusic() { musicOn = false; clearInterval(timer); timer = null; }
  function duck(on) { if (ac) musicBus.gain.setTargetAtTime(on ? 0.12 : 0.5, ac.currentTime, 0.05); }

  /* ---- loops (sirens) ---- */
  function loop(key, on, type, base, depth, rate, vol) {
    if (!ac) return;
    if (on && !loops[key]) {
      const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
      o.type = type; o.frequency.value = base; l.type = 'triangle'; l.frequency.value = rate; lg.gain.value = depth;
      l.connect(lg); lg.connect(o.frequency);
      g.gain.value = 0; g.gain.setTargetAtTime(vol, ac.currentTime, 0.03);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;   // soften the tone
      o.connect(g); g.connect(lp); lp.connect(sfxBus); o.start(); l.start();
      loops[key] = { o, g, l };
    } else if (!on && loops[key]) {
      const L = loops[key]; delete loops[key];
      L.g.gain.setTargetAtTime(0, ac.currentTime, 0.03);
      const t = ac.currentTime + 0.25; L.o.stop(t); L.l.stop(t);
    }
  }
  const fright = on => loop('fright', on, 'triangle', 330, 40, 3.5, 0.03);
  const eyes = on => loop('eyes', on, 'sine', 800, 140, 8, 0.03);

  /* ---- effects ---- */
  function waka() {
    if (!ac) return; wakaFlip = !wakaFlip;
    tone({ f: wakaFlip ? 520 : 200, f2: wakaFlip ? 200 : 520, dur: 0.075, type: 'square', vol: 0.09 });
  }
  function eatGhost() {
    tone({ f: 180, f2: 1500, dur: 0.28, type: 'square', vol: 0.14 });
    tone({ f: 360, f2: 2200, dur: 0.28, type: 'triangle', vol: 0.1, at: 0.02 });
  }
  function fruit() {
    tone({ f: 700, dur: 0.08, vol: 0.12 }); tone({ f: 1050, dur: 0.08, vol: 0.12, at: 0.08 }); tone({ f: 1400, dur: 0.14, vol: 0.12, at: 0.16 });
  }
  function death() {
    if (!ac) return;
    const sweeps = [[900, 280], [760, 230], [620, 180], [480, 110]];
    sweeps.forEach((s, i) => tone({ f: s[0], f2: s[1], dur: 0.3, type: 'square', vol: 0.15, at: i * 0.3 }));
    sweeps.forEach((s, i) => tone({ f: s[0] / 2, f2: s[1] / 2, dur: 0.3, type: 'sawtooth', vol: 0.07, at: i * 0.3 }));
    for (let i = 0; i < 3; i++) tone({ f: 1200 - i * 150, f2: 300, dur: 0.1, type: 'square', vol: 0.12, at: 1.3 + i * 0.12 });
  }
  function arp(notes, step, type, vol, dur) {
    notes.forEach((n, i) => tone({ f: mtof(n), dur: dur || step * 1.5, type: type || 'square', vol: vol || 0.1, at: i * step }));
  }
  function intro() { arp([57,64,69,72, 59,66,71,74, 60,67,72,76, 64,71,76,79, 69,72,76,81], 0.1, 'square', 0.09, 0.14); }
  function levelClear() { arp([69,72,76,81, 76,81,84,88], 0.11, 'square', 0.1, 0.16); }
  function extraLife() { arp([76,79,84,88,91], 0.07, 'triangle', 0.14, 0.12); }
  function gameOver() { arp([69,66,62,57,50], 0.22, 'sawtooth', 0.1, 0.3); }

  function poison() {
    for (let i = 0; i < 5; i++) tone({ f: 700 - i * 90, f2: 160, dur: 0.14, type: 'sawtooth', vol: 0.12, at: i * 0.08 });
    tone({ f: 90, f2: 50, dur: 0.5, type: 'square', vol: 0.12 });
  }
  function poisonAlert() { tone({ f: 300, f2: 120, dur: 0.18, type: 'sawtooth', vol: 0.09 }); tone({ f: 300, f2: 120, dur: 0.18, type: 'sawtooth', vol: 0.09, at: 0.2 }); }
  function lane() { arp([60, 55, 60, 55], 0.09, 'square', 0.08, 0.1); }
  function bolt() { tone({ f: 500, f2: 1900, dur: 0.12, type: 'square', vol: 0.12 }); tone({ f: 1000, f2: 2600, dur: 0.12, type: 'square', vol: 0.1, at: 0.1 }); }

/* ---------------- modes / fright ---------------- */

}

/* ---------------- fruit ---------------- */

const fruitIndex = () => Math.min(level - 1, 12);

/* ---------------- collisions & events ---------------- */
function popup(x, y, text, color) { popups.push({ x, y, text, color, t: 0 }); }

  };

    if (g.state === 'eyes' || g.state === 'entering' || g.state === 'shock') return;
    if (g.state === 'house' || g.state === 'leaving') put(13, 11); else put(Math.round(g.x), Math.round(g.y));
  });

    const [c, r] = q[h];
    for (const d of DIRS) {
      let nc = c + d.x, nr = r + d.y;
      if (r === TUNNEL_ROW) { if (nc < 0) nc = COLS - 1; else if (nc >= COLS) nc = 0; }
      if (c === PASS_COL) { if (nr < 0) nr = ROWS - 1; else if (nr >= ROWS) nr = 0; }

function spawnPoison() {

function stepPlaying(dt) {
  if (freeze > 0) { freeze -= dt; if (freeze <= 0) ghosts.forEach(g => g.eatenFreeze = false); return; }

  playTime += dt;
  // dots regrow, oldest first
  while (regenQ.length && playTime - regenQ[0].t >= REGEN_TIME) {
    const q = regenQ.shift();
    if (!dots[q.r][q.c]) { dots[q.r][q.c] = q.v; born[q.r][q.c] = playTime; remaining++; }
  }
  // lanes re-randomize
  laneTimer -= dt;
  if (laneTimer <= 0) { laneTimer = LANE_EVERY; randomizeLanes(); Sound.lane(); popup(13.5, 17, 'LANES SHIFTED!', '#00ffcc'); }
  // difficulty
  levelTimer -= dt;
  if (levelTimer <= 0) { levelTimer = LEVEL_EVERY; levelUp(); }
  // poison dot
  nextPoison -= dt;
  if (poison) { poison.t -= dt; if (poison.t <= 0) { if (dots[poison.r][poison.c] === 3) dots[poison.r][poison.c] = 1; poison = null; } }
  else if (nextPoison <= 0 && spawnPoison()) nextPoison = rj(POISON_EVERY);
  // lightning-bolt dot
  nextBolt -= dt;
  if (bolt) { bolt.t -= dt; if (bolt.t <= 0) { if (dots[bolt.r][bolt.c] === 4) dots[bolt.r][bolt.c] = 1; bolt = null; } }
  else if (nextBolt <= 0 && spawnBolt()) nextBolt = rj(30);
  // heart & snail dots
  nextHeart -= dt; nextSnail -= dt;
  if (heart) { heart.t -= dt; if (heart.t <= 0) { if (dots[heart.r][heart.c] === 5) dots[heart.r][heart.c] = 1; heart = null; } }
  else if (nextHeart <= 0) { heart = spawnSpecial(5); if (heart) nextHeart = rj(HEART_EVERY); }
  if (snail) { snail.t -= dt; if (snail.t <= 0) { if (dots[snail.r][snail.c] === 6) dots[snail.r][snail.c] = 1; snail = null; } }
  else if (nextSnail <= 0) { snail = spawnSpecial(6); if (snail) nextSnail = rj(SNAIL_EVERY); }
  nextSnow -= dt;
  if (snow) { snow.t -= dt; if (snow.t <= 0) { if (dots[snow.r][snow.c] === 7) dots[snow.r][snow.c] = 1; snow = null; } }
  else if (nextSnow <= 0) { snow = spawnSpecial(7); if (snow) nextSnow = rj(SNOW_EVERY); }
  if (slowTimer > 0) slowTimer = Math.max(0, slowTimer - dt);
  nextGold -= dt;
  if (gold) { gold.t -= dt; if (gold.t <= 0) { if (dots[gold.r][gold.c] === 8) dots[gold.r][gold.c] = 1; gold = null; } }
  else if (nextGold <= 0) { gold = spawnSpecial(8); if (gold) nextGold = rj(GOLD_EVERY); }
  if (iceTimer > 0) iceTimer = Math.max(0, iceTimer - dt);
  if (electTimer > 0) electTimer = Math.max(0, electTimer - dt);
  // fat Pac
  if (wideTimer > 0) wideTimer = Math.max(0, wideTimer - dt);
  const tr = wideTimer > 0 ? PAC_R_WIDE : PAC_R_NORMAL;
  pac.r += Math.sign(tr - pac.r) * Math.min(Math.abs(tr - pac.r), 14 * dt);

  if (frightTimer > 0) { frightTimer -= dt; if (frightTimer <= 0) endFright(); }
  else if (iceTimer <= 0) { modeTimer -= dt; if (modeTimer <= 0) nextMode(); }

  if (iceTimer <= 0) releaseLogic(dt);
  updatePac(dt);
  ghosts.forEach(g => { if (iceTimer <= 0 || g.state === 'shock') updateGhost(g, dt); });   // frozen ghosts stay put

  // sirens
  Sound.fright(frightTimer > 0 && ghosts.some(g => g.frightened));
  Sound.eyes(ghosts.some(g => g.state === 'eyes' || g.state === 'entering'));

  // fruit
  if (fruit) {
    fruit.t -= dt;
    if (fruit.t <= 0) fruit = null;
    else if (Math.hypot(pac.x - fruit.x, pac.y - fruit.y) < 0.7) {
      const pts = FRUIT_PTS[fruitIndex()]; addScore(pts); Sound.fruit();
      popup(fruit.x, fruit.y, String(pts), '#ffb8ff'); fruit = null;
    }
  }

  // ghost collisions
  for (const g of ghosts) {
    if (g.state === 'eyes' || g.state === 'entering' || g.state === 'house' || g.state === 'shock') continue;
    const touch = Math.hypot(g.x - pac.x, g.y - pac.y) < hitR();
    if (touch && electTimer > 0) { electrocute(g); continue; }       // electrified Pac-Man zaps any ghost he touches
    if (iceTimer > 0 && !g.frightened) continue;                     // frozen ghosts are harmless
    if (touch) {

      killPac(); return;
    }
  }
}

function update(dt) {
  globalTime += dt; stateTime += dt;
  for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t > 0.6) fx.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 1.1) popups.splice(i, 1); }
  switch (state) {
    case 'ready':
      if (stateTime >= readyDur) { state = 'playing'; stateTime = 0; firstReady = false; pac.dir = LEFT; pac.face = LEFT; Sound.startMusic(); }
      break;
    case 'playing': {
      const n = Math.max(1, Math.ceil(dt / (1 / 60)));
      for (let i = 0; i < n && state === 'playing'; i++) stepPlaying(dt / n);
      break;
    }
    case 'dying':
      if (stateTime >= 0.9 && !update.dsPlayed) { update.dsPlayed = true; Sound.death(); }
      if (stateTime >= 3.0) {
        update.dsPlayed = false;
        if (lives > 0) { resetActors(); startReady(); }
        else { state = 'gameover'; stateTime = 0; Sound.gameOver(); saveHi(); }
      }
      break;
  }
}

    ctx.strokeStyle = cols[k % 3]; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * rIn, y + Math.sin(a) * rIn);
    for (let j = 1; j <= 3; j++) {
      const rr = rIn + len * j / 3, aa = a + (rnd(tick * 3.1 + k * 5.3 + j * 1.7 + seed) - 0.5) * 0.9;
      ctx.lineTo(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawGold(x, y) {
  const t = globalTime;
  if (gold && gold.t < 3 && Math.floor(t * 10) % 2 === 0) return;
  ctx.save();
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 14;
  const g = ctx.createRadialGradient(x - 1.2, y - 1.2, 0.5, x, y, 5.2);
  g.addColorStop(0, '#fffbe0'); g.addColorStop(0.45, '#ffd700'); g.addColorStop(1, '#c98a00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 4.6 * (1 + 0.1 * Math.sin(t * 10)), 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#fffbe8'; ctx.lineWidth = 1;
  for (let k = 0; k < 4; k++) {                               // twinkling 4-point sparkles
    const ph = (t * 1.7 + k / 4) % 1, a = k * 1.9 + Math.floor(t * 1.7 + k / 4) * 2.3;
    const px_ = x + Math.cos(a) * 7, py_ = y + Math.sin(a) * 6, sz = Math.sin(ph * Math.PI) * 3.4;
    ctx.beginPath(); ctx.moveTo(px_ - sz, py_); ctx.lineTo(px_ + sz, py_); ctx.moveTo(px_, py_ - sz); ctx.lineTo(px_, py_ + sz); ctx.stroke();
  }
  ctx.restore();
}
function drawSnowflake(x, y) {
  const t = globalTime;
  if (snow && snow.t < 3 && Math.floor(t * 10) % 2 === 0) return;
  ctx.save();
  for (let k = 0; k < 5; k++) {                           // rising white fumes
    const ph = (t * 0.8 + k / 5) % 1;
    ctx.globalAlpha = (1 - ph) * 0.65; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x + Math.sin(ph * 7 + k * 2) * 4, y - 3 - ph * 17, 1.6 + ph * 3.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowColor = '#9fe8ff'; ctx.shadowBlur = 14;
  ctx.strokeStyle = '#c8f3ff'; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
  const L = 6.6 * (1 + 0.12 * Math.sin(t * 8));
  ctx.translate(x, y); ctx.rotate(t * 0.6);
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a);
    ctx.moveTo(0, 0); ctx.lineTo(ca * L, sa * L);
    for (const b of [-0.6, 0.6]) {                          // little branches
      const bx = ca * L * 0.6, by = sa * L * 0.6, aa = a + b;
      ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(aa) * L * 0.38, by + Math.sin(aa) * L * 0.38);
    }
  }
  ctx.stroke(); ctx.restore();
}
function drawSnail(x, y) {
  if (snail && snail.t < 3 && Math.floor(globalTime * 10) % 2 === 0) return;
  const bob = Math.sin(globalTime * 4) * 0.8;
  ctx.save(); ctx.translate(x, y + bob); ctx.shadowColor = 'rgba(255,255,255,0.6)'; ctx.shadowBlur = 6;
  ctx.fillStyle = '#b8e08a';                               // body
  ctx.beginPath(); ctx.ellipse(0.5, 3.4, 6.6, 2.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.6, 1.6, 2.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b8e08a'; ctx.lineWidth = 1; ctx.beginPath();   // antennae
  ctx.moveTo(5.8, 0); ctx.lineTo(7.2, -3.2); ctx.moveTo(4.6, 0.2); ctx.lineTo(4.4, -3.4); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(6.2, 1.2, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d98a3d'; ctx.beginPath(); ctx.arc(-1, -0.8, 4.6, 0, Math.PI * 2); ctx.fill();   // shell
  ctx.strokeStyle = '#7a3f12'; ctx.lineWidth = 1; ctx.beginPath();
  for (let a = 0; a < 9; a += 0.25) { const r = 0.4 + a * 0.45; const px_ = -1 + Math.cos(a) * r, py_ = -0.8 + Math.sin(a) * r; a ? ctx.lineTo(px_, py_) : ctx.moveTo(px_, py_); }
  ctx.stroke(); ctx.restore();
}
function drawBoltDot(x, y) {
  if (bolt && bolt.t < 3 && Math.floor(globalTime * 10) % 2 === 0) return;
  ctx.save();
  ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 14;
  ctx.fillStyle = Math.floor(globalTime * 9) % 2 ? '#ffff00' : '#ffffff';
  boltPath(x, y, 7.5 + Math.sin(globalTime * 14)); ctx.fill();
  ctx.restore();
}
function drawPoison(x, y) {
  const t = globalTime;
  if (poison && poison.t < 3 && Math.floor(t * 10) % 2 === 0) return;
  ctx.save();
  for (let k = 0; k < 5; k++) {                           // rising fumes
    const ph = (t * 0.8 + k / 5) % 1;
    ctx.globalAlpha = (1 - ph) * 0.6; ctx.fillStyle = '#8dff3a';
    ctx.beginPath(); ctx.arc(x + Math.sin(ph * 7 + k * 2) * 4, y - 2 - ph * 17, 1.6 + ph * 3.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 14; ctx.fillStyle = '#39ff14';
  ctx.beginPath(); ctx.arc(x, y, 4.2 * (1 + 0.25 * Math.sin(t * 12)), 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#eaffd0'; ctx.beginPath(); ctx.arc(x - 1, y - 1, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawDots() {
  const pelletOn = Math.floor(globalTime * 3.5) % 2 === 0 || state === 'title' || paused;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = dots[r][c]; if (!v) continue;
    const age = playTime - born[r][c], sc = age < 0.4 ? 0.3 + 0.7 * (age / 0.4) : 1;
    ctx.fillStyle = '#ffb8ae';
    if (v === 1) { const w = 3.2 * sc; ctx.fillRect(px(c) - w / 2, py(r) - w / 2, w, w); }
    else if (v === 2) { if (pelletOn) { ctx.beginPath(); ctx.arc(px(c), py(r), 5.6 * sc, 0, Math.PI * 2); ctx.fill(); } }
    else if (v === 3) drawPoison(px(c), py(r));
    else if (v === 4) drawBoltDot(px(c), py(r));
    else if (v === 5) drawHeart(px(c), py(r));
    else if (v === 6) drawSnail(px(c), py(r));
    else if (v === 7) drawSnowflake(px(c), py(r));
    else drawGold(px(c), py(r));
  }
}

function drawSkullFuzz(x, y, r, col) {                       // cartoon skull inside a spiky black fuzz halo
  const t = globalTime, tick = Math.floor(t * 20), N = 22, R = r * 1.2;
  ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // fuzz halo: ragged black spikes with a thin electric rim so it reads on the black maze
  ctx.beginPath();
  for (let i = 0; i < N * 2; i++) {
    const a = i / (N * 2) * Math.PI * 2, out = i % 2 === 0;
    const len = out ? R * (1.25 + rnd(tick * 1.7 + i * 2.3) * 0.55) : R * (0.98 + rnd(tick * 2.9 + i) * 0.1);
    const aa = a + (out ? (rnd(tick * 0.7 + i * 5.1) - 0.5) * 0.12 : 0);
    ctx.lineTo(Math.cos(aa) * len, Math.sin(aa) * len);
  }
  ctx.closePath();
  ctx.fillStyle = '#050508'; ctx.strokeStyle = '#7fe9ff'; ctx.lineWidth = 1; ctx.shadowColor = '#7fe9ff'; ctx.shadowBlur = 7;
  ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  // skull: wide cranium + narrower jaw
  const chat = 0.5 + 0.5 * Math.sin(t * 60);                // jaw chatter
  ctx.fillStyle = '#fbfbf4'; ctx.strokeStyle = '#111'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.95, r * 0.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const jy = r * 0.5 + chat * r * 0.12;
  ctx.beginPath(); ctx.moveTo(-r * 0.62, r * 0.35); ctx.lineTo(-r * 0.55, jy + r * 0.28);
  ctx.quadraticCurveTo(0, jy + r * 0.42, r * 0.55, jy + r * 0.28); ctx.lineTo(r * 0.62, r * 0.35); ctx.closePath(); ctx.fill(); ctx.stroke();
  // huge black eye sockets with a tiny glint
  ctx.fillStyle = '#0a0a0a';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s * r * 0.4, -r * 0.2, r * 0.3, r * 0.34, s * 0.08, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * r * 0.4 - r * 0.07, -r * 0.3, r * 0.07, 0, Math.PI * 2); ctx.fill(); }
  // nose
  ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.moveTo(0, r * 0.08); ctx.lineTo(-r * 0.09, r * 0.28); ctx.lineTo(r * 0.09, r * 0.28); ctx.closePath(); ctx.fill();
  // open mouth with top and bottom teeth
  const mt = r * 0.38, mb = jy + r * 0.2;
  ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.moveTo(-r * 0.5, mt); ctx.lineTo(r * 0.5, mt); ctx.lineTo(r * 0.42, mb); ctx.lineTo(-r * 0.42, mb); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fbfbf4';
  for (let i = 0; i < 4; i++) {
    const tx = -r * 0.42 + i * r * 0.21, th = r * (0.17 + 0.05 * rnd(i + 9));
    ctx.fillRect(tx, mt, r * 0.17, th);                      // upper teeth
    ctx.fillRect(tx + r * 0.05, mb - r * 0.14, r * 0.15, r * 0.14);   // lower teeth
  }
  ctx.restore();
}
function drawShocked(g) {                                    // rattling, flashing normal <-> skeleton
  const r = T * 0.5, x = px(g.x) + Math.sin(globalTime * 95) * 2.3, y = py(g.y) + Math.cos(globalTime * 80) * 1.7;
  if (Math.floor(globalTime * 14) % 2 === 0) { drawGhostPx(x, y, r, g.color, g.look || LEFT, 0, 'n', false); }
  else drawSkullFuzz(x, y, r * 1.1, g.color);
  drawSparks(x, y, r * 1.2, r * 2.1, 6, 11);
}
function drawGhosts() {
  const frame = Math.floor(globalTime * 8) % 2;
  for (const g of ghosts) {
    if (g.eatenFreeze) continue;
    if (g.state === 'shock') { drawShocked(g); continue; }
    let mode = 'n', flashOn = false;
    if (g.state === 'eyes' || g.state === 'entering') mode = 'e';
    else if (g.frightened) { mode = 'f'; flashOn = frightTimer < 1.5 && Math.floor(frightTimer * 6) % 2 === 0; }
    drawGhostPx(px(g.x), py(g.y), T * 0.5, g.color, g.look || LEFT, frame, mode, flashOn);
    if (iceTimer > 0 && mode !== 'e' && (iceTimer > ICE_FLASH || Math.floor(iceTimer * 8) % 2 === 0)) {   // ice shell (flashes at the end)
      const r = T * 0.5 * 1.15; ctx.save(); ctx.translate(px(g.x), py(g.y));
      ctx.fillStyle = 'rgba(160,228,255,0.6)'; ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -r * 0.1, r, Math.PI, 0); ctx.lineTo(r, r * 0.95); ctx.lineTo(-r, r * 0.95); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawPacman() {
  const R = pac.r;
  if (state === 'dying') {
    if (stateTime < 0.9) { drawPacPx(px(pac.x), py(pac.y), R, pac.face, 0.05); return; }
    const p = Math.min(1, (stateTime - 0.9) / 1.5);
    if (p >= 1) return;
    ctx.save(); ctx.translate(px(pac.x), py(pac.y)); ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#ffe600'; ctx.beginPath(); ctx.moveTo(0, 0);
    const a = 0.05 + p * (Math.PI - 0.05);
    ctx.arc(0, 0, R, a, Math.PI * 2 - a); ctx.closePath(); ctx.fill(); ctx.restore();
    return;
  }
  const mouth = state === 'playing' && pac.dir !== NONE ? pacMouth() : (state === 'playing' ? 0.3 : 0.05);
  ctx.save();
  if (wideTimer > 0) {
    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 12;
    if (wideTimer < WIDE_FLASH && Math.floor(wideTimer * 6) % 2 === 0) ctx.globalAlpha = 0.3;
  }
  drawPacPx(px(pac.x), py(pac.y), R, pac.face, mouth, wideTimer > 0 ? '#a6ff2e' : '#ffe600');
  ctx.restore();
  if (electTimer > 0 && (electTimer > ELEC_FLASH || Math.floor(electTimer * 10) % 2 === 0)) {   // electric sparks (flash in the last 3 s)
    ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = '#7fe9ff'; ctx.lineWidth = 2; ctx.shadowColor = '#7fe9ff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(px(pac.x), py(pac.y), R * 1.25 + Math.sin(globalTime * 30) * 1.2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    drawSparks(px(pac.x), py(pac.y), R * 0.75, R * 1.9, 7, 0);
  }
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, OFFY, W, ROWS * T);
  txt('PAC-MAN', W / 2, 128, '#ffe600', 56, 'center', '#ffaa00');
  txt('RETRO ARCADE TRIBUTE', W / 2, 170, '#00ffff', 13, 'center');
  const rows = [['BLINKY', '"SHADOW"'], ['PINKY', '"SPEEDY"'], ['INKY', '"BASHFUL"'], ['CLYDE', '"POKEY"']];
  rows.forEach((rw, i) => {
    const y = 222 + i * 34, g = ghosts[i];
    drawGhostPx(112, y, 11, g.color, RIGHT, Math.floor(globalTime * 8) % 2, 'n', false);
    txt(rw[0], 140, y, g.color, 16, 'left');
    txt(rw[1], 250, y, '#8a90b8', 14, 'left');
  });
  ctx.fillStyle = '#ffb8ae'; ctx.fillRect(116, 372 - 1.6, 3.2, 3.2);
  txt('10', 132, 372, '#fff', 13, 'left');
  ctx.beginPath(); ctx.arc(190, 372, 5.6, 0, Math.PI * 2); ctx.fill();
  txt('50', 202, 372, '#fff', 13, 'left');
  txt('GHOSTS 200·400·800·1600', 250, 372, '#8a90b8', 11, 'left');
  txt('GREEN POISON DOT = FAT PAC · 2 DASHES = WIDE LANE', W / 2, 398, '#7dff2a', 11, 'center');
  txt('LANES SHIFT EVERY MINUTE · DOTS REGROW AFTER 10s', W / 2, 414, '#8a90b8', 11, 'center');
  txt('YELLOW BOLT DOT = +1 TELEPORT (SPACE / DOUBLE TAP)', W / 2, 430, '#ffff40', 11, 'center');
  txt('HEART = +1 LIFE   SNAIL = SLOWS GHOSTS', W / 2, 446, '#ff8aa0', 11, 'center');
  txt('SNOWFLAKE = FREEZE   GOLD = ELECTRIC PAC', W / 2, 462, '#ffe27a', 11, 'center');
  // little chase animation
  const span = W + 220, off = (globalTime * 95) % span - 110;
  drawPacPx(off, 484, 10, RIGHT, 0.04 + Math.abs(Math.sin(globalTime * 11)) * 0.75);
  ghosts.forEach((g, i) => drawGhostPx(off - 34 - i * 28, 484, 10.5, g.color, RIGHT, Math.floor(globalTime * 8 + i) % 2, 'n', false));
  if (Math.floor(globalTime * 2) % 2 === 0) txt('PRESS ENTER OR CLICK TO START', W / 2, 508, '#fff', 15, 'center');
  txt('ARROWS / WASD  MOVE', W / 2, 518, '#8a90b8', 12, 'center');
  txt('SPACE / DOUBLE-TAP TELEPORT   P PAUSE   M MUTE', W / 2, 536, '#8a90b8', 12, 'center');
}

function drawOverlays() {
  const cy = py(17), cyp = py(11);
  if (state === 'ready') {
    if (firstReady) txt('PLAYER ONE', W / 2, cyp, '#00ffff', 15, 'center');
    txt('READY!', W / 2, cy, '#ffe600', 15, 'center');
  } else if (state === 'gameover') {
    if (stateTime < 2.5) txt('GAME OVER', W / 2, cy, '#ff2020', 15, 'center');
    else {
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, OFFY, W, ROWS * T);
      txt('GAME OVER', W / 2, 190, '#ff2020', 40, 'center', '#ff0000');
      txt('SCORE ' + score, W / 2, 262, '#fff', 20, 'center');
      txt('HIGH SCORE ' + hi, W / 2, 296, '#ffe600', 16, 'center');
      if (score > 0 && score >= hi) txt('NEW HIGH SCORE!', W / 2, 332, '#00ffff', 16, 'center');
      txt('LEVEL REACHED ' + level, W / 2, 366, '#8a90b8', 13, 'center');
      if (Math.floor(globalTime * 2) % 2 === 0) txt('PRESS ENTER OR CLICK TO PLAY AGAIN', W / 2, 430, '#fff', 14, 'center');
    }
  }
  for (const p of popups) {
    const a = Math.max(0, 1 - Math.max(0, p.t - 0.7) / 0.4);
    ctx.globalAlpha = a; txt(p.text, px(p.x), py(p.y) - p.t * 6, p.color, 12, 'center'); ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, OFFY, W, ROWS * T);
    txt('PAUSED', W / 2, H / 2 - 12, '#ffe600', 34, 'center', '#ffaa00');
    txt('PRESS P TO RESUME', W / 2, H / 2 + 24, '#fff', 13, 'center');
  }
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawHUD();
  ctx.drawImage(wallsBlue, 0, OFFY, W, ROWS * T);
  ctx.drawImage(laneCanvas, 0, OFFY, W, ROWS * T);
  if (state !== 'gameover' || stateTime < 2.5) drawDots();
  if (state === 'title') { drawTitle(); drawBottomHUD(); return; }
  ctx.save(); ctx.beginPath(); ctx.rect(0, OFFY, W, ROWS * T); ctx.clip();
  if (fruit) drawFruitPx(fruitIndex() <= 12 ? FRUIT_KIND[fruitIndex()] : 7, px(fruit.x), py(fruit.y), 8);
  const showGhosts = state === 'ready' || state === 'playing' || (state === 'dying' && stateTime < 0.9);
  if (state !== 'gameover') drawPacman();
  if (showGhosts) drawGhosts();
  ctx.restore();
  for (const f of fx) {
    const k = f.t / 0.6; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffff66'; ctx.lineWidth = 2.5; ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(px(f.x), py(f.y), 4 + k * 24, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  drawOverlays();
  drawBottomHUD();
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
randomizeLanes();
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
